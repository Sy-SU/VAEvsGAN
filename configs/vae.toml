model = "vae"

[train]
data_dir = "data/MNIST"
checkpoint = "models/vae.pt"
epochs = 20
batch_size = 128
learning_rate = 0.001
latent_dim = 20
seed = 42
num_workers = 0
device = "auto"
progress_digit = 5
progress_snapshots = 10
training_progress_output = "outputs/vae/train-progress.png"

[test]
data_dir = "data/MNIST"
checkpoint = "models/vae.pt"
output = "outputs/vae/reconstructions.png"
num_images = 8
batch_size = 128
seed = 42
num_workers = 0
device = "auto"

[generate]
checkpoint = "models/vae.pt"
num_samples = 64
output = "outputs/vae/generated.png"
seed = 42
device = "auto"
