model = "gan"

[train]
data_dir = "data/MNIST"
checkpoint = "models/gan.pt"
epochs = 50
batch_size = 128
learning_rate = 0.0002
latent_dim = 20
label_embedding_dim = 50
adam_beta1 = 0.5
adam_beta2 = 0.999
conditional_negative_weight = 0.5
seed = 42
num_workers = 0
device = "auto"
progress_digit = 5
progress_snapshots = 10
training_progress_output = "outputs/gan/train-progress.png"

[test]
data_dir = "data/MNIST"
checkpoint = "models/gan.pt"
output = "outputs/gan/test-grid.png"
samples_per_class = 8
batch_size = 128
seed = 42
num_workers = 0
device = "auto"

[generate]
checkpoint = "models/gan.pt"
num_samples = 64
output = "outputs/gan/generated.png"
seed = 42
device = "auto"
